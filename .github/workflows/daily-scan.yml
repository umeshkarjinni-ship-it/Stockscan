name: NiftyPulsePro Daily Scan

on:
  workflow_dispatch:        # allows manual runs from the Actions tab
  schedule:
    # 02:30 UTC = 08:00 IST, Mon-Fri — before the 09:15 IST market open,
    # so you get the recommendations with time to act on them.
    #
    # Signals come from COMPLETED bars, so running pre-open uses the
    # previous session's close. That's correct, not a limitation.
    #
    # GitHub schedules are best-effort and can be delayed 10-30+ minutes
    # under load, so treat 08:00 as "around 08:00", not a guarantee.
    - cron: "30 2 * * 1-5"

permissions:
  contents: write   # needed so the workflow can commit paper_trades.csv back

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # a full 2,075-symbol scan can take well over an
                            # hour (10y of daily data x thousands of tickers)
                            # — this was previously 30, which cut the run
                            # off after only ~500 symbols

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          SCANNER_EMAIL_FROM: ${{ secrets.SCANNER_EMAIL_FROM }}
          SCANNER_EMAIL_TO: ${{ secrets.SCANNER_EMAIL_TO }}
          SCANNER_EMAIL_APP_PASSWORD: ${{ secrets.SCANNER_EMAIL_APP_PASSWORD }}
          SCANNER_EMAIL_BCC: ${{ secrets.SCANNER_EMAIL_BCC }}
          SCANNER_HIDE_COLS: ${{ secrets.SCANNER_HIDE_COLS }}
          SCANNER_TELEGRAM_TOKEN: ${{ secrets.SCANNER_TELEGRAM_TOKEN }}
          SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.SCANNER_TELEGRAM_CHAT_ID }}
        run: python -u nse_scanner.py

      - name: Generate signal report
        run: python -u signal_report.py

      - name: Rank buy candidates
        run: python -u rank_buy.py

      - name: Score candidates with ML model
        run: python -u -m ml.predict

      - name: Check for conflicting BUY/SELL signals
        run: python -u check_conflicting_signals.py

      - name: Track daily recommendations forward
        run: python -u paper_trade_tracker.py

      - name: Build dashboard
        run: python -u build_dashboard.py

      - name: Email daily recommendations
        if: always()   # still send even if an earlier optional step failed
        env:
          SCANNER_EMAIL_FROM: ${{ secrets.SCANNER_EMAIL_FROM }}
          SCANNER_EMAIL_TO: ${{ secrets.SCANNER_EMAIL_TO }}
          SCANNER_EMAIL_APP_PASSWORD: ${{ secrets.SCANNER_EMAIL_APP_PASSWORD }}
          SCANNER_EMAIL_BCC: ${{ secrets.SCANNER_EMAIL_BCC }}
          SCANNER_HIDE_COLS: ${{ secrets.SCANNER_HIDE_COLS }}
          SCANNER_DASHBOARD_URL: ${{ vars.SCANNER_DASHBOARD_URL }}
        run: python -u send_daily_email.py

      - name: Commit paper trade tracker + dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add each path independently and tolerate failures. A single
          # missing or gitignored file must not abort the whole step —
          # that previously failed the run with exit code 1 and left the
          # tracker state uncommitted.
          for f in signals/paper_trades.csv \
                   signals/paper_trade_summary.txt \
                   signals/conflicting_signals.csv \
                   signals/market_regime.json \
                   docs/index.html; do
            [ -f "$f" ] && git add "$f" || echo "skip $f"
          done
          git diff --staged --quiet || git commit -m "Update paper trade tracker + dashboard [skip ci]"
          git push || echo "Nothing to push"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niftypulsepro-results-${{ github.run_number }}
          path: |
            signals/scan_*.csv
            signals/failed_symbols.csv
            signals/daily_signal_report.csv
            signals/daily_top20_buy.csv
            signals/daily_top20_sell.csv
            signals/daily_top20_buy_watchlist.csv
            signals/daily_top20_sell_watchlist.csv
            signals/daily_top20_buy_ranked.csv
            signals/daily_top20_buy_ml_ranked.csv
            signals/conflicting_signals.csv
            signals/market_regime.json
            signals/paper_trades.csv
            signals/paper_trade_summary.txt
          retention-days: 30
