name: NSE Daily Scanner

on:
  schedule:
    # 11:00 AM IST = 05:30 UTC, Monday-Friday (NSE trading days).
    # GitHub Actions cron is always UTC — adjust the first two numbers
    # (minute hour) if you want a different IST time. Example: for 6:00 PM
    # IST use '30 12 * * 1-5'.
    - cron: '30 5 * * 1-5'
  workflow_dispatch: {}   # lets you manually trigger a run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit paper_trades.csv back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 210   # generous ceiling for a ~2000+ stock universe.
                            # The ~140-stock starter list takes a few
                            # minutes; a full ~2000-2100 stock NSE universe
                            # (via build_universe.py) can take 90-150+
                            # minutes depending on Yahoo Finance's response
                            # times that day. GitHub's hard per-job cap is
                            # 360 minutes on the free tier, so 210 leaves
                            # real headroom without being unbounded.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NSE scanner
        env:
          SCANNER_EMAIL_FROM: ${{ secrets.SCANNER_EMAIL_FROM }}
          SCANNER_EMAIL_TO: ${{ secrets.SCANNER_EMAIL_TO }}
          SCANNER_EMAIL_APP_PASSWORD: ${{ secrets.SCANNER_EMAIL_APP_PASSWORD }}
        run: python nse_scanner.py

      # paper_trades.csv persists the paper-trade tracker's open/closed
      # positions across runs. Each run is a fresh checkout, so without
      # committing this back, every day would start from zero and the
      # tracker could never accumulate real win-rate/return stats.
      - name: Commit updated paper trade tracker
        if: always()
        run: |
          if [ -f paper_trades.csv ]; then
            git config user.name "nse-scanner-bot"
            git config user.email "actions@github.com"
            git add paper_trades.csv
            git diff --staged --quiet || git commit -m "Update paper trade tracker [skip ci]"
            git push
          fi

      # Keeps the full CSV (all signals, not just the emailed top 20) and
      # failed_symbols.csv available to download from the Actions run page,
      # even though nothing is committed back to the repo.
      - name: Upload full results as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-scan-results-${{ github.run_id }}
          path: signals/
          retention-days: 30
